name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Pinned, not "newest 3.11": the retrieval audit's seed-0 check matches the committed audit
      # only with this build's SQLite (3.53.1); an older SQLite shifts some values (ERRATA E42).
      UV_PYTHON: "3.11.18"
    steps:
      # Full history: scripts/uar_trajectory.py, run by the validator, reads superseded
      # results/v1_scale/E_sft_memory responses from commits e9e5ca8 and 5a9fe1b.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11.18
        run: uv python install 3.11.18

      - name: Install dependencies
        # ruff, black, mypy and pytest live in the `dev` extra; a bare `uv sync` does not install
        # them and every later step would fail. See docs/GUARDRAILS.md G8.
        run: uv sync --extra dev

      - name: Ruff check
        run: uv run ruff check

      - name: Black check
        run: uv run black --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest

      # Study 001 is frozen: fail the build if a hash-pinned artifact has changed. A changed byte
      # means either a correction (belongs in reports/ERRATA.md) or a new result (belongs to
      # Study 002) — see docs/STUDIES.md.
      - name: Study 001 freeze check
        run: uv run python scripts/freeze_study_001.py --check

      # The whole audit in one step: the freeze, every dataset hash, every metric recomputed from
      # its own raw.jsonl, the claims matrix in registry/claims.jsonl, registry counts against the
      # data files, cross-document consistency, and the 13-gram contamination check. CPU-only and
      # offline. Identical to `make validate`. See docs/AUDIT.md.
      - name: Validate (claims matrix, registries, recomputed metrics)
        run: uv run python scripts/validate.py

      # Post-hoc audit of Study 001's retriever (results/audit/retrieval/): replays the frozen
      # retriever from committed query embeddings and stores, clock and hash seed pinned, and fails
      # if the committed output is stale. The 21-seed spread is too slow for CI and is not rechecked.
      - name: Retrieval audit freshness
        run: uv run python scripts/retrieval_audit.py --check --no-spread
