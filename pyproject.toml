[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onebee"
version = "0.1.0"
description = "Post-training an LLM with external memory/retrieval architecture"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

# Base deps: enough to import every module and run the CPU-only unit test suite in CI.
# Heavy/GPU-bound deps live in the `gpu` extra (see below) — CI never installs it.
dependencies = [
  "sqlite-vec>=0.1",
  "hydra-core>=1.3",
  "pydantic>=2",
  "numpy>=1.26",
  "rank-bm25>=0.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Training/inference/embedding stack — requires a CUDA GPU to be useful; install on the
# RTX PRO 6000 workstation with `uv sync --extra gpu`, not in CI.
gpu = [
  "torch>=2.1",
  "transformers>=4.40",
  "trl>=0.9",
  "peft>=0.11",
  "datasets>=2.19",
  "accelerate>=0.30",
  "bitsandbytes>=0.43",
  "vllm>=0.4",
  "sentence-transformers>=3.0",
  "wandb>=0.17",
  "pillow>=10",
  # required by some VLM processors (e.g. SmolVLM) for number-to-word text normalization
  "num2words>=0.5",
]
dev = [
  "ruff>=0.4",
  "black>=24",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "pre-commit>=3.7",
]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
# LLM-as-judge scoring (e.g. the bake-off) — kept separate from `gpu`, which pulls
# the training/inference stack; judging only needs the OpenAI client.
judge = [
  "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onebee"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["onebee"]

[tool.ruff.lint.per-file-ignores]
# Research driver scripts import *after* load_dotenv(), or after freeing a model to reclaim VRAM.
# The import order is load-bearing, not accidental, so E402 does not apply to them.
"compare_*.py" = ["E402"]
"generate_*.py" = ["E402"]
"run_*.py" = ["E402"]
# Model cards and the card generators embed long markdown lines verbatim. Wrapping them would
# change the published card text, and the template manipulates sys.path before importing.
"hf_readmes/*" = ["E501", "E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "skip"
# NOTE: pinned above the project's actual 3.10 minimum because numpy's shipped
# .pyi stubs use PEP 695 `type` aliases unconditionally; mypy needs
# python_version >= 3.12 just to parse them. This only affects which stdlib/
# typeshed syntax mypy permits during checking, not the runtime requirement.
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: quick end-to-end sanity checks for CI smoke-eval workflow",
]
