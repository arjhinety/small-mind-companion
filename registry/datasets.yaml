schema_version: 1
# Every corpus committed under `data/`, with record counts and hash provenance read from the
# corpus itself rather than from a document. `uv run python scripts/validate.py` recomputes every
# count and every hash listed here and fails on any drift.
#
# `hash_algorithm` is one of:
#   sha256_tree_lf       sha256 over a sorted directory walk; for each file, the LF-normalised
#                        relative POSIX path bytes then the LF-normalised file bytes, skipping
#                        hash.txt itself (scripts/build_pmb.py).
#   sha256_concat_jsonl  sha256 over the concatenated LF-normalised *.jsonl of each split, in
#                        sorted filename order (generate_sft_data.py / generate_dpo_data.py).
#   null                 no hash.txt is committed; the corpus is not integrity-pinned.
#
# `contamination_status` is one of:
#   CLEAN_VERIFIED        scripts/check_contamination.py reported "No contamination found."
#                         against data/benchmarks/pmb_v0_full/probes.jsonl.
#   INHERITED_CLEAN       a strict subset of a CLEAN_VERIFIED parent; not separately checked.
#   EVAL_REFERENCE        the evaluation set itself -- the corpus others are checked against.
#   TRAINING_CORPUS       training data; leak-checked against EVAL_REFERENCE, not "a benchmark".
#   NOT_ASSESSED          no contamination check has been run.
#   NOT_APPLICABLE        derived or fixture data with no text-distribution claim.
#
# `freeze_pinned` records whether the Study 001 freeze manifest pins this corpus's bytes
# (reports/data/study-001-freeze.json). A corpus may be tracked in git and still not be pinned.
#
# `evidence` maps a registry assertion to the exact `file:line` in the corpus's own documentation
# that makes it, and `evidence_text` maps the same key to a literal string that line must contain.
# This is what stops the registry's documentary claims ("this corpus was contamination-checked")
# from being taken on trust: `scripts/validate.py` resolves every anchor and matches every string.
status: VERIFIED_AGAINST_ARTIFACTS
contamination_reference: data/benchmarks/pmb_v0_full/probes.jsonl
contamination_command: >-
  uv run python scripts/check_contamination.py
  --train-glob <corpus>/train.jsonl
  --eval-glob data/benchmarks/pmb_v0_full/probes.jsonl
contamination_verified_on: "2026-09-13"
datasets:
  - id: pmb-v0-full
    display_name: PMB v0 -- Personalized Memory Benchmark (evaluation)
    kind: benchmark
    path: data/benchmarks/pmb_v0_full
    datasetsheet: data/benchmarks/pmb_v0_full/DATASHEET.md
    records: 688
    record_unit: probe
    extra_counts:
      personas: 8
      categories: 8
      probes_per_persona: 86
      answerable: 608
      unanswerable: 80
      acceptable_alternatives_populated: 0
    splits:
      - name: all
        path: data/benchmarks/pmb_v0_full/probes.jsonl
        records: 688
    hash_file: data/benchmarks/pmb_v0_full/hash.txt
    hash_algorithm: sha256_tree_lf
    freeze_pinned: true
    contamination_status: EVAL_REFERENCE
    notes: >-
      The only corpus any reported pra_lenient/uar number is measured on. 64/64 populated
      (persona x category) cells.
    evidence:
      human_review: "data/benchmarks/pmb_v0_full/DATASHEET.md:30"
      personas_and_cells: "data/benchmarks/pmb_v0_full/DATASHEET.md:17"
      probes: "data/benchmarks/pmb_v0_full/DATASHEET.md:17"
      unpopulated_field: "data/benchmarks/pmb_v0_full/DATASHEET.md:32"
    evidence_text:
      human_review: "not yet human-reviewed"
      personas_and_cells: "64/64 cells"
      probes: "Total probes**: 688"
      unpopulated_field: "unpopulated"

