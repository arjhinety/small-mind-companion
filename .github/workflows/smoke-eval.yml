name: Smoke Eval

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      # pytest lives in the `dev` extra; a bare `uv sync` does not install it (same as ci.yml).
      - name: Install dependencies
        run: uv sync --extra dev

      # Will start doing real work once tests/integration/test_smoke.py exists
      - name: Run smoke tests
        run: uv run pytest tests/integration -k smoke -q
