      personas: 2
      facts_per_persona: 8
    splits:
      - name: all
        path: data/benchmarks/pmb_v0/probes.jsonl
        records: 36
    hash_file: data/benchmarks/pmb_v0/hash.txt
    hash_algorithm: sha256_tree_lf
    freeze_pinned: true
    contamination_status: NOT_APPLICABLE
    notes: >-
      Deterministic fixture teacher, no live LLM. Exists to exercise scripts/build_pmb.py and
      the eval harness. Not the benchmark; do not report metrics from it.
    evidence:
      not_a_benchmark: "data/benchmarks/pmb_v0/DATASHEET.md:5"
      probes: "data/benchmarks/pmb_v0/DATASHEET.md:18"
    evidence_text:
      not_a_benchmark: "fixture-scale smoke test"
      probes: "Total probes**: 36"

